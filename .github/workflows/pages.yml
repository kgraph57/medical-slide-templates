name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "decks/**"
      - "examples/**"
      - "engine/**"
      - "theme/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/decks _site/examples
          cp -r site/* _site/
          cp -r decks/medical-template-catalog _site/decks/
          cp -r examples/ja-journal-club examples/en-case-conference _site/examples/
          cp -r engine theme _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" style="width:100%;height:auto;display:block" viewBox="0 0 1440 810" role="img" aria-labelledby="anatomy-callout-title anatomy-callout-desc">
  <title id="anatomy-callout-title">Anatomy callout / 解剖コールアウト</title><desc id="anatomy-callout-desc">Abstract non-diagnostic anatomy placeholder with numbered callouts and a legend.</desc>
  <style>:root{--bg:#f7f8fa;--ink:#17212b;--muted:#5b6773;--line:#66717d;--accent:#1a5fb4}text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.k{font-size:18px;font-weight:700;letter-spacing:3px;fill:var(--accent)}.t{font-size:48px;font-weight:700;fill:var(--ink)}.s{font-size:22px;fill:var(--muted)}.h{font-size:22px;font-weight:700;fill:var(--ink)}.b{font-size:18px;fill:var(--muted)}.n{font-size:18px;font-weight:700;fill:white}</style>
  <rect width="1440" height="810" fill="var(--bg)"/><text class="k" x="88" y="80">ANATOMY CALLOUT / 解剖図</text><text class="t" x="88" y="148">番号と凡例で指し示す</text><text class="s" x="88" y="191">この図形は非診断用のプレースホルダ。</text>
  <path d="M420 300 C300 365 310 620 465 690 C610 755 790 650 760 485 C735 345 555 245 420 300Z" fill="#e8edf3" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="430" cy="390" r="20" fill="var(--accent)"/><text class="n" x="425" y="396">1</text><line x1="450" y1="390" x2="930" y2="330" stroke="var(--line)" stroke-width="3"/><circle cx="570" cy="560" r="20" fill="var(--accent)"/><text class="n" x="565" y="566">2</text><line x1="590" y1="560" x2="930" y2="500" stroke="var(--line)" stroke-width="3"/>
  <text class="h" x="960" y="325">1  Structure label</text><text class="b" x="960" y="365">Name + verified finding</text><line x1="930" y1="420" x2="1290" y2="420" stroke="var(--line)"/><text class="h" x="960" y="495">2  Structure label</text><text class="b" x="960" y="535">Name + verified finding</text>
  <line x1="88" y1="734" x2="1352" y2="734" stroke="var(--ink)" stroke-width="2"/><text class="b" x="88" y="778">Replace with a licensed image and meaningful alt text. 権利確認済み画像とaltに置き換える。</text>

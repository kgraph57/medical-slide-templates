<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" style="width:100%;height:auto;display:block" viewBox="0 0 1440 810" role="img" aria-labelledby="evidence-map-title evidence-map-desc">
  <title id="evidence-map-title">Evidence map / エビデンスマップ</title><desc id="evidence-map-desc">Claim, evidence, limitation, and decision arranged as a traceable chain.</desc>
  <style>:root{--bg:#f7f8fa;--ink:#17212b;--muted:#5b6773;--line:#66717d;--accent:#1a5fb4}text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.k{font-size:18px;font-weight:700;letter-spacing:3px;fill:var(--accent)}.t{font-size:48px;font-weight:700;fill:var(--ink)}.s{font-size:22px;fill:var(--muted)}.h{font-size:22px;font-weight:700;fill:var(--ink)}.b{font-size:18px;fill:var(--muted)}.n{font-size:18px;font-weight:700;letter-spacing:2px;fill:var(--accent)}.box{fill:var(--bg);stroke:var(--ink);stroke-width:3}</style>
  <rect width="1440" height="810" fill="var(--bg)"/><text class="k" x="88" y="80">EVIDENCE MAP / 根拠の追跡</text><text class="t" x="88" y="148">主張から判断までをつなぐ</text><text class="s" x="88" y="191">根拠と限界を必ず同じ流れに置く。</text>
  <rect class="box" x="90" y="350" width="270" height="180" rx="18"/><text class="n" x="130" y="395">CLAIM</text><text class="h" x="130" y="445">What is stated?</text><text class="b" x="130" y="485">主張</text>
  <line x1="360" y1="440" x2="445" y2="440" stroke="var(--line)" stroke-width="3"/><circle cx="445" cy="440" r="8" fill="var(--ink)"/><rect class="box" x="445" y="350" width="270" height="180" rx="18"/><text class="n" x="485" y="395">EVIDENCE</text><text class="h" x="485" y="445">What supports it?</text><text class="b" x="485" y="485">出典・データ</text>
  <line x1="715" y1="440" x2="800" y2="440" stroke="var(--line)" stroke-width="3"/><circle cx="800" cy="440" r="8" fill="var(--ink)"/><rect class="box" x="800" y="350" width="270" height="180" rx="18"/><text class="n" x="840" y="395">LIMIT</text><text class="h" x="840" y="445">What remains?</text><text class="b" x="840" y="485">限界・不確実性</text>
  <line x1="1070" y1="440" x2="1155" y2="440" stroke="var(--line)" stroke-width="3"/><circle cx="1155" cy="440" r="8" fill="var(--accent)"/><rect class="box" x="1155" y="350" width="195" height="180" rx="18"/><text class="n" x="1190" y="395">DECISION</text><text class="h" x="1190" y="445">Next step</text><text class="b" x="1190" y="485">判断</text>
  <line x1="88" y1="734" x2="1352" y2="734" stroke="var(--ink)" stroke-width="2"/><text class="b" x="88" y="778">Unverified evidence must remain visibly unverified. 未検証は未検証のまま表示する。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" style="width:100%;height:auto;display:block" viewBox="0 0 1440 810" role="img" aria-labelledby="causal-path-title causal-path-desc">
  <title id="causal-path-title">Causal path / 因果経路</title><desc id="causal-path-desc">Directed arrows connect exposure, mediator, and outcome; dashed directed arrows identify possible confounding.</desc>
  <defs><marker id="causal-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#17212b"/></marker></defs>
  <style>:root{--bg:#f7f8fa;--ink:#17212b;--muted:#5b6773;--line:#66717d;--accent:#1a5fb4}text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.k{font-size:18px;font-weight:700;letter-spacing:3px;fill:var(--accent)}.t{font-size:48px;font-weight:700;fill:var(--ink)}.s{font-size:22px;fill:var(--muted)}.h{font-size:24px;font-weight:700;fill:var(--ink)}.b{font-size:18px;fill:var(--muted)}.box{fill:var(--bg);stroke:var(--ink);stroke-width:3}</style>
  <rect width="1440" height="810" fill="var(--bg)"/><text class="k" x="88" y="80">CAUSAL PATH / 因果経路</text><text class="t" x="88" y="148">関係と不確実性を分ける</text><text class="s" x="88" y="191">矢印は関連か因果かを凡例で明示する。</text>
  <rect class="box" x="100" y="390" width="300" height="130" rx="18"/><text class="h" x="155" y="450">Exposure</text><text class="b" x="155" y="487">曝露</text><rect class="box" x="570" y="390" width="300" height="130" rx="18"/><text class="h" x="625" y="450">Mediator</text><text class="b" x="625" y="487">媒介</text><rect class="box" x="1040" y="390" width="300" height="130" rx="18"/><text class="h" x="1095" y="450">Outcome</text><text class="b" x="1095" y="487">アウトカム</text>
  <line x1="400" y1="455" x2="564" y2="455" stroke="var(--ink)" stroke-width="3" marker-end="url(#causal-path-arrow)"/><line x1="870" y1="455" x2="1034" y2="455" stroke="var(--ink)" stroke-width="3" marker-end="url(#causal-path-arrow)"/>
  <text class="h" x="595" y="295">Confounder / 交絡</text><line x1="710" y1="315" x2="255" y2="389" stroke="var(--line)" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#causal-path-arrow)"/><line x1="730" y1="315" x2="1185" y2="389" stroke="var(--line)" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#causal-path-arrow)"/>
  <line x1="88" y1="734" x2="1352" y2="734" stroke="var(--ink)" stroke-width="2"/><text class="b" x="88" y="778">Solid arrow = specified direction. Dashed arrow = possible confounding. 実線矢印=定義済みの方向、破線矢印=交絡候補。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" style="width:100%;height:auto;display:block" viewBox="0 0 1440 810" role="img" aria-labelledby="clinical-timeline-title clinical-timeline-desc">
  <title id="clinical-timeline-title">Clinical timeline / 臨床タイムライン</title><desc id="clinical-timeline-desc">Relative time points with anonymized events above and below a baseline.</desc>
  <style>:root{--bg:#f7f8fa;--ink:#17212b;--muted:#5b6773;--line:#66717d;--accent:#1a5fb4}text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.k{font-size:18px;font-weight:700;letter-spacing:3px;fill:var(--accent)}.t{font-size:48px;font-weight:700;fill:var(--ink)}.s{font-size:22px;fill:var(--muted)}.h{font-size:22px;font-weight:700;fill:var(--ink)}.b{font-size:18px;fill:var(--muted)}.n{font-size:18px;font-weight:700;fill:var(--accent)}</style>
  <rect width="1440" height="810" fill="var(--bg)"/><text class="k" x="88" y="80">CLINICAL TIMELINE / 臨床経過</text><text class="t" x="88" y="148">相対時間で経過を読む</text><text class="s" x="88" y="191">実日付や個人識別情報は載せない。</text>
  <line x1="120" y1="455" x2="1320" y2="455" stroke="var(--line)" stroke-width="3"/>
  <g><circle cx="180" cy="455" r="12" fill="var(--ink)"/><line x1="180" y1="443" x2="180" y2="350" stroke="var(--ink)" stroke-width="2"/><text class="n" x="140" y="325">DAY 0</text><text class="h" x="140" y="292">Presentation</text><text class="b" x="140" y="505">Verified event</text></g>
  <g><circle cx="540" cy="455" r="12" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/><line x1="540" y1="467" x2="540" y2="570" stroke="var(--ink)" stroke-width="2"/><text class="n" x="500" y="625">DAY +1</text><text class="h" x="500" y="662">Assessment</text><text class="b" x="500" y="412">Verified event</text></g>
  <g><circle cx="900" cy="455" r="12" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/><line x1="900" y1="443" x2="900" y2="350" stroke="var(--ink)" stroke-width="2"/><text class="n" x="860" y="325">DAY +3</text><text class="h" x="860" y="292">Response</text><text class="b" x="860" y="505">Verified event</text></g>
  <g><circle cx="1260" cy="455" r="12" fill="var(--accent)"/><line x1="1260" y1="467" x2="1260" y2="570" stroke="var(--accent)" stroke-width="2"/><text class="n" x="1200" y="625">FOLLOW-UP</text><text class="h" x="1200" y="662">Outcome</text><text class="b" x="1200" y="412">Verify date range</text></g>
  <line x1="88" y1="734" x2="1352" y2="734" stroke="var(--ink)" stroke-width="2"/><text class="b" x="88" y="778">Use relative dates unless exact dates are necessary and de-identified. 原則として相対日付を使う。</text>
</svg>

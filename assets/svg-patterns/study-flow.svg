<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" style="width:100%;height:auto;display:block" viewBox="0 0 1440 810" role="img" aria-labelledby="study-flow-title study-flow-desc">
  <title id="study-flow-title">Study flow / 研究フロー</title><desc id="study-flow-desc">A neutral study flow with counts intentionally left as placeholders.</desc>
  <style>:root{--bg:#f7f8fa;--ink:#17212b;--muted:#5b6773;--line:#66717d;--accent:#1a5fb4}text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.k{font-size:18px;font-weight:700;letter-spacing:3px;fill:var(--accent)}.t{font-size:48px;font-weight:700;fill:var(--ink)}.s{font-size:22px;fill:var(--muted)}.h{font-size:23px;font-weight:700;fill:var(--ink)}.b{font-size:18px;fill:var(--muted)}.box{fill:var(--bg);stroke:var(--ink);stroke-width:3}</style>
  <rect width="1440" height="810" fill="var(--bg)"/><text class="k" x="88" y="80">STUDY FLOW / 研究フロー</text><text class="t" x="88" y="148">人数の整合性を見える化する</text><text class="s" x="88" y="191">数値はバリデータを通してから入れる。</text>
  <rect class="box" x="100" y="365" width="270" height="135" rx="16"/><text class="h" x="145" y="425">Assessed</text><text class="b" x="145" y="465">n = [required]</text><line x1="370" y1="432" x2="535" y2="432" stroke="var(--line)" stroke-width="3"/><circle cx="535" cy="432" r="8" fill="var(--ink)"/>
  <rect class="box" x="535" y="365" width="270" height="135" rx="16"/><text class="h" x="580" y="425">Eligible</text><text class="b" x="580" y="465">n = [required]</text><line x1="805" y1="432" x2="970" y2="432" stroke="var(--line)" stroke-width="3"/><circle cx="970" cy="432" r="8" fill="var(--ink)"/>
  <rect class="box" x="970" y="365" width="270" height="135" rx="16"/><text class="h" x="1015" y="425">Analyzed</text><text class="b" x="1015" y="465">n = [required]</text>
  <line x1="670" y1="500" x2="670" y2="605" stroke="var(--line)" stroke-width="2" stroke-dasharray="10 7"/><rect x="525" y="605" width="290" height="95" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-width="2" stroke-dasharray="10 7"/><text class="h" x="565" y="650">Excluded</text><text class="b" x="565" y="681">n + reasons required</text>
  <line x1="88" y1="734" x2="1352" y2="734" stroke="var(--ink)" stroke-width="2"/><text class="b" x="88" y="778">Placeholder counts must block final export. 人数未入力のまま最終出力しない。</text>
</svg>
